name: CI

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
      - master
      - dev
  push:
    branches:
      - main
      - master
      - dev

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Lint, typecheck & test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Update npm to v11.5.2
        run: npm install -g npm@11.5.2

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests with coverage
        run: npm run test:cov -- --runInBand

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Update npm to v11.5.2
        run: npm install -g npm@11.5.2
        
      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  deploy-production:
    name: Deploy production
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    concurrency:
      group: hyperdata-production
      cancel-in-progress: false
    steps:
      - name: Configure Netcup SSH
        shell: bash
        run: |
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "${{ secrets.NETCUP_KNOWN_HOSTS }}" > "$HOME/.ssh/known_hosts"
          printf '%s\n' "${{ secrets.NETCUP_SSH_PRIVATE_KEY }}" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"

      - name: Deploy backend and dependent services
        env:
          NETCUP_HOST: ${{ secrets.NETCUP_HOST }}
          NETCUP_PORT: ${{ secrets.NETCUP_PORT || '22' }}
          NETCUP_USER: ${{ secrets.NETCUP_USER }}
        run: |
          ssh -p "$NETCUP_PORT" "$NETCUP_USER@$NETCUP_HOST" \
            '/home/deploy/hyperdata/src/hyperdata-backend/deploy/deploy.sh backend'
